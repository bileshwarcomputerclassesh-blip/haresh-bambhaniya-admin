<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHREE BILESHWER COMPUTER CLASSES | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#12345a;--blue:#1769aa;--bg:#f3f6fb;--line:#dce4ef;--text:#182538}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Gujarati",sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--blue);color:#fff;font-weight:650}button.secondary{background:#e8eef7;color:var(--navy)}button.danger{background:#b42318}.hidden{display:none!important}.top{background:linear-gradient(120deg,#12345a,#1769aa);color:white;padding:20px}.top h1{font-size:21px;margin:0 0 5px}.top p{margin:0;opacity:.9}.wrap{max-width:1200px;margin:auto;padding:16px}.login{max-width:420px;margin:48px auto;background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 32px #163d6810}.login h2{margin-top:0}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-weight:650;font-size:14px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff;color:#111827}.field textarea{min-height:90px;resize:vertical}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}.side,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:14px}.side{position:sticky;top:12px}.nav{display:block;width:100%;text-align:left;background:white;color:#24364b;margin:3px 0;padding:10px;border-radius:9px}.nav.active,.nav:hover{background:#eaf3ff;color:#07569a}.panel h2{margin:4px 0 12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;overflow-wrap:anywhere}.item img{width:100%;height:145px;object-fit:cover;border-radius:8px;background:#eef2f7}.item h3{margin:8px 0 5px;font-size:17px}.muted{color:#64748b;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:13px;padding:8px 10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.span2{grid-column:1/-1}.status{display:inline-block;background:#eef2f7;padding:4px 8px;border-radius:999px;font-size:12px}.notice{padding:10px;border-radius:9px;margin:10px 0;background:#eaf3ff;color:#174a7a}.notice.error{background:#fff0ef;color:#9f2119}.notice.success{background:#eaf8ef;color:#176438}.orderrow{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.empty{padding:24px;text-align:center;color:#64748b}.small{font-size:12px;color:#64748b}@media(max-width:720px){.layout{grid-template-columns:1fr}.side{position:static}.navlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.orderrow{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:16px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>SHREE BILESHWER COMPUTER CLASSES</h1><p>Admin Website · સંચાલન પેનલ</p></div></header>
<main class="wrap">
<section id="loginView" class="login"><h2>Admin Login</h2><p class="muted">તમારા પહેલેથી બનાવેલા Admin ઈમેલથી લૉગિન કરો.</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>ઈમેલ</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>પાસવર્ડ</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit" style="width:100%">લૉગિન કરો</button></form></section>
<section id="appView" class="hidden"><div class="toolbar"><div><strong id="welcome">Admin Panel</strong><div class="muted">અહીં કરેલા ફેરફારો એપમાં પણ દેખાશે.</div></div><button id="logout" class="secondary">લૉગઆઉટ</button></div><div class="layout"><aside class="side"><div class="navlist" id="nav"></div></aside><section class="panel"><div id="message"></div><div id="content"></div></section></div></section>
</main>
<script>
const SUPABASE_URL='https://nzodnjircsjxjohymaaq.supabase.co';
const SUPABASE_KEY='sb_publishable_lyqssl4vky--JCYGoXoQ5g_S0EgMvvJ';
const ADMIN_UID='91249a58-2fea-4a71-b06b-0b8dcda72328';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const modules={
courses:{label:'કોર્સ',table:'courses',title:'કોર્સ',fields:[['name','કોર્સનું નામ','text',true],['description','વર્ણન','textarea'],['duration','સમયગાળો','text'],['price','ફી / કિંમત','number'],['image_url','ફોટો','image']]},
education_info:{label:'ભણતરની માહિતી',table:'education_info',title:'શીર્ષક',fields:[['title','શીર્ષક','text',true],['description','વર્ણન','textarea'],['image_url','ફોટો','image']]},
farmer_portal:{label:'ખેડૂત પોર્ટલ',table:'farmer_portal',title:'શીર્ષક',fields:[['title','શીર્ષક','text',true],['description','વર્ણન','textarea'],['image_url','ફોટો','image']]},
job_vacancies:{label:'સરકારી નોકરી ભરતી',table:'job_vacancies',title:'ભરતી / પોસ્ટનું નામ',fields:[['title','ભરતી / પોસ્ટનું નામ','text',true],['category','કેટેગરી','text'],['description','વર્ણન','textarea'],['link_url','લિંક','url'],['image_url','ફોટો','image']]},
information:{label:'માહિતી',table:'information',title:'માહિતી',fields:[['title','શીર્ષક','text'],['description','માહિતી','textarea',true]]},
updates:{label:'અપડેટ',table:'updates',title:'અપડેટ',fields:[['update_date','તારીખ','date',true],['weekday','વાર','text'],['update_text','અપડેટ લખાણ','textarea',true]]},
legal_services:{label:'વકીલની સેવાઓ',table:'legal_services',title:'શીર્ષક',fields:[['title','શીર્ષક','text',true],['description','વિગત','textarea']]},
desktop_products:{label:'ડેસ્કટોપ વેચાણ',table:'desktop_products',title:'પ્રોડક્ટ',fields:[['name','પ્રોડક્ટનું નામ','text',true],['description','વર્ણન','textarea'],['price','કિંમત','number',true],['image_url','ફોટો','image']]}
};
let active='courses',editing=null,rows=[],orderRows=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(s,type='success'){ $('message').innerHTML=s?'<div class="notice '+(type==='error'?'error':'success')+'">'+esc(s)+'</div>':''; }
function loginMsg(s,type='error'){ $('loginMsg').innerHTML=s?'<div class="notice '+type+'">'+esc(s)+'</div>':''; }
function adminCheck(user){return user&&user.id===ADMIN_UID}
async function syncSession(){const {data:{session}}=await db.auth.getSession();if(session&&adminCheck(session.user)){showApp(session.user)}else{ $('appView').classList.add('hidden');$('loginView').classList.remove('hidden');if(session) await db.auth.signOut();}}
function showApp(user){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('welcome').textContent='સ્વાગત, '+(user.email||'Admin');drawNav();renderModule();}
function drawNav(){const links=Object.entries(modules).map(([k,v])=>'<button type="button" class="nav '+(active===k?'active':'')+'" data-nav="'+k+'">'+esc(v.label)+'</button>').join('')+'<button type="button" class="nav '+(active==='orders'?'active':'')+'" data-nav="orders">ઓર્ડર લિસ્ટ</button>';const nav=$('nav');nav.innerHTML=links;nav.onclick=async e=>{const b=e.target.closest('[data-nav]');if(!b||!nav.contains(b))return;e.preventDefault();const next=b.dataset.nav;if(next!=='orders'&&!modules[next]){msg('આ ઓપ્શન મળ્યો નથી. પેજ રીફ્રેશ કરો.','error');return;}active=next;editing=null;drawNav();try{if(active==='orders')await renderOrders();else await renderModule();}catch(err){msg('ઓપ્શન ખોલી શકાયું નહીં: '+(err?.message||String(err)),'error');}};}
function inputField(f,v=''){const [key,label,type,required]=f;let val=v??'';if(key==='update_date'&&!val)val=new Date().toISOString().slice(0,10);if(type==='textarea')return '<div class="field span2"><label>'+esc(label)+(required?' *':'')+'</label><textarea name="'+key+'" '+(required?'required':'')+'>'+esc(val)+'</textarea></div>';if(type==='image')return '<div class="field span2"><label>'+esc(label)+' (JPG/PNG/WebP, વધુમાં વધુ 5MB)</label><input type="file" name="image_file" accept="image/jpeg,image/png,image/webp"><input type="hidden" name="image_url" value="'+esc(val)+'"><div class="small">'+(val?'હાલનો ફોટો સાચવેલો છે':'ફોટો પસંદ કરો')+'</div></div>';return '<div class="field"><label>'+esc(label)+(required?' *':'')+'</label><input name="'+key+'" type="'+type+'" value="'+esc(val)+'" '+(required?'required':'')+(type==='number'?' min="0" step="0.01"':'')+'></div>';}
async function uploadImage(form,table){const file=form.querySelector('[name=image_file]')?.files?.[0];let url=form.querySelector('[name=image_url]')?.value||null;if(!file)return url;if(file.size>5*1024*1024)throw Error('ફોટો 5MB કરતાં મોટો ન હોવો જોઈએ.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG, PNG અથવા WebP ફોટો પસંદ કરો.');const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');const path=table+'/'+Date.now()+'-'+safe;const {error}=await db.storage.from('class-media').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;const {data}=db.storage.from('class-media').getPublicUrl(path);return data.publicUrl;}
async function renderModule(){if(active==='orders')return renderOrders();const m=modules[active];if(!m){$('content').innerHTML='<div class="notice error">આ વિભાગ મળ્યો નથી. ડાબી બાજુથી ફરી પસંદ કરો.</div>';return;}$('content').innerHTML='<h2>'+esc(m.label)+'</h2><div class="muted">નવી માહિતી ઉમેરો અથવા જૂની માહિતીમાં ફેરફાર કરો.</div><form id="recordForm"><div class="formgrid">'+m.fields.map(f=>inputField(f,editing?.[f[0]])).join('')+'</div><div class="actions"><button type="submit">'+(editing?'ફેરફાર સાચવો':'ઉમેરો')+'</button>'+(editing?'<button type="button" class="secondary" id="cancelEdit">રદ કરો</button>':'')+'</div></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="toolbar"><strong>ઉમેરેલી માહિતી</strong><button type="button" class="secondary" id="refresh">રીફ્રેશ</button></div><div id="records" class="grid"><div class="empty">લોડ થઈ રહ્યું છે…</div></div>';
$('recordForm').onsubmit=saveRecord;if(editing)$('cancelEdit').onclick=()=>{editing=null;renderModule()};$('refresh').onclick=loadRecords;await loadRecords();}
async function loadRecords(){const m=modules[active];const {data,error}=await db.from(m.table).select('*').order('created_at',{ascending:false});if(error){$('records').innerHTML='<div class="notice error">ડેટા લોડ થયો નહીં: '+esc(error.message)+'</div>';return;}rows=data||[];if(!rows.length){$('records').innerHTML='<div class="empty">હજુ કોઈ માહિતી ઉમેરેલી નથી.</div>';return;}$('records').innerHTML=rows.map(r=>{const title=r.name||r.title||r.update_text||'માહિતી';const desc=r.description||r.update_text||'';return '<article class="item">'+(r.image_url?'<img src="'+esc(r.image_url)+'" alt="ફોટો">':'')+'<h3>'+esc(title)+'</h3>'+(r.price!==undefined?'<strong>₹'+esc(r.price)+'</strong>':'')+(r.duration?'<div class="muted">સમયગાળો: '+esc(r.duration)+'</div>':'')+(r.update_date?'<div class="muted">'+esc(r.update_date)+' · '+esc(r.weekday)+'</div>':'')+'<p>'+esc(desc).slice(0,240)+'</p>'+(r.link_url?'<a href="'+esc(r.link_url)+'" target="_blank" rel="noopener">લિંક ખોલો</a>':'')+'<div class="actions"><button class="secondary" data-edit="'+r.id+'">ફેરફાર</button><button class="danger" data-delete="'+r.id+'">ડિલીટ</button></div></article>';}).join('');$('records').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=rows.find(r=>r.id===b.dataset.edit);renderModule();window.scrollTo({top:0,behavior:'smooth'});});$('records').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.delete));}
async function saveRecord(e){e.preventDefault();const form=e.currentTarget;const m=modules[active];const b=form.querySelector('button[type=submit]');b.disabled=true;try{const obj={};for(const f of m.fields){const el=form.elements[f[0]];if(el){let v=el.value;if(f[2]==='number')v=v===''?0:Number(v);obj[f[0]]=v;}}if(m.table==='information'&&!obj.title)obj.title='માહિતી';if(m.table==='updates'&&!obj.weekday){const days=['રવિવાર','સોમવાર','મંગળવાર','બુધવાર','ગુરુવાર','શુક્રવાર','શનિવાર'];obj.weekday=days[new Date(obj.update_date+'T12:00:00').getDay()];}if(m.fields.some(f=>f[2]==='image'))obj.image_url=await uploadImage(form,m.table);const result=editing?await db.from(m.table).update(obj).eq('id',editing.id):await db.from(m.table).insert(obj);if(result.error)throw result.error;editing=null;msg('માહિતી સફળતાપૂર્વક સાચવાઈ.');await renderModule();}catch(err){msg('સાચવી શકાઈ નહીં: '+err.message,'error');}finally{b.disabled=false;}}
async function deleteRecord(id){if(!confirm('આ માહિતી કાયમ માટે ડિલીટ કરવી છે?'))return;const {error}=await db.from(modules[active].table).delete().eq('id',id);if(error)msg('ડિલીટ થયું નહીં: '+error.message,'error');else{msg('માહિતી ડિલીટ થઈ.');await loadRecords();}}
async function renderOrders(){$('content').innerHTML='<h2>ડેસ્કટોપ ઓર્ડર</h2><div class="muted">ગ્રાહકની વિગતો, ઓર્ડર સ્ટેટસ અને ફોન બટન.</div><div class="actions"><button id="refreshOrders" class="secondary">ઓર્ડર રીફ્રેશ</button></div><div id="ordersList"><div class="empty">લોડ થઈ રહ્યું છે…</div></div>';$('refreshOrders').onclick=loadOrders;await loadOrders();}
async function loadOrders(){const {data,error}=await db.from('desktop_orders').select('*').order('created_at',{ascending:false});if(error){$('ordersList').innerHTML='<div class="notice error">ઓર્ડર લોડ થયા નહીં: '+esc(error.message)+'</div>';return;}orderRows=data||[];if(!orderRows.length){$('ordersList').innerHTML='<div class="empty">હજુ કોઈ ઓર્ડર નથી.</div>';return;}const statuses=['નવો','કન્ફર્મ','ડિલિવરીમાં','પૂર્ણ','રદ'];$('ordersList').innerHTML=orderRows.map(o=>'<article class="orderrow"><div><strong>'+esc(o.product_name)+'</strong> · ₹'+esc(o.product_price)+'<p style="margin:6px 0"><b>'+esc(o.customer_name)+'</b> · '+esc(o.mobile_number)+'</p><div>'+esc(o.address)+'</div><div class="muted">તારીખ: '+new Date(o.created_at).toLocaleString('gu-IN')+'</div><div class="muted">ઓર્ડર ID: '+esc(o.id)+'</div></div><div><span class="status">'+esc(o.status)+'</span><div class="field"><label>સ્ટેટસ બદલો</label><select data-status="'+o.id+'">'+statuses.map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><a href="tel:'+esc(o.mobile_number.replace(/[^0-9+]/g,''))+'"><button type="button">ગ્રાહકને ફોન કરો</button></a></div></article>').join('');$('ordersList').querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('desktop_orders').update({status:s.value}).eq('id',s.dataset.status);if(error){msg('સ્ટેટસ બદલાયું નહીં: '+error.message,'error');await loadOrders();}else msg('ઓર્ડર સ્ટેટસ અપડેટ થયું.');});}
$('loginForm').onsubmit=async e=>{e.preventDefault();loginMsg('લૉગિન થઈ રહ્યું છે…','success');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){loginMsg('લૉગિન થયું નહીં: '+error.message);return;}if(!adminCheck(data.user)){await db.auth.signOut();loginMsg('આ એકાઉન્ટને Admin પરવાનગી નથી.');return;}loginMsg('');showApp(data.user);};
$('logout').onclick=async()=>{await db.auth.signOut();await syncSession();};db.auth.onAuthStateChange((_event,session)=>{if(!session){$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');}});syncSession();
</script>
</body></html>
