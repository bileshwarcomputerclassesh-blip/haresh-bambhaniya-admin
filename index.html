
<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b72">
  <title>Haresh Bambhaniya | Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Haresh Bambhaniya</h1>
      <p>SHREE BILESHWAR COMPUTER</p>
    </div>
    <button id="logoutBtn" hidden>Logout</button>
  </header>

  <main>
    <section id="loginSection" class="panel">
      <h2>Admin Login</h2>
      <p>Website મેનેજ કરવા Login કરો.</p>
      <form id="loginForm">
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="username"
          placeholder="Admin email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          autocomplete="current-password"
          placeholder="Password" required>

        <button type="submit">Login</button>
        <p id="loginMessage" role="status"></p>
      </form>
    </section>

    <section id="dashboardSection" hidden>
      <div class="welcome panel">
        <h2>Admin Dashboard</h2>
        <p>તમારી સંસ્થાની માહિતી અહીંથી મેનેજ કરો.</p>
        <p id="statusMessage" role="status">Database સાથે જોડાઈ રહ્યું છે...</p>
      </div>

      <nav class="menu" aria-label="Admin sections">
        <button data-section="courses">Courses</button>
        <button data-section="students">Students</button>
        <button data-section="attendance">Attendance</button>
        <button data-section="fees">Fees</button>
        <button data-section="notices">Notices</button>
        <button data-section="gallery">Gallery</button>
        <button data-section="about">About</button>
        <button data-section="history">Student History</button>
        <button data-section="feedback">Feedback</button>
      </nav>

      <section id="contentSection" class="panel">
        <h2>Dashboard</h2>
        <p>ઉપરના વિભાગમાંથી વિકલ્પ પસંદ કરો.</p>
      </section>
    </section>
  </main>

  <footer>
    <p>© SHREE BILESHWAR COMPUTER</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
